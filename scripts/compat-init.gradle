// Gradle init script for the native x86_64 build of FongMi/TV.
// Kept as a standalone repo file; the workflow only references it with `-I`.
// It applies to the main build and to all included builds (custom Media3).

gradle.beforeProject { p ->
    // AGP 9 + Gradle 9 embedded-Kotlin compatibility:
    // Gradle pins org.jetbrains:annotations to {strictly 13.0} ("Pinned to the
    // embedded Kotlin"), while AGP 9.x pulls annotations:23.0.0. The two are
    // unsatisfiable together and fail at configuration time. Force the pinned
    // version on both the buildscript classpath and regular configurations.
    // (kotlin-stdlib only *requires* 13.0, so forcing 13.0 satisfies everyone.)
    p.buildscript.configurations.all {
        resolutionStrategy.force 'org.jetbrains:annotations:13.0'
    }
    p.configurations.all {
        resolutionStrategy.force 'org.jetbrains:annotations:13.0'
    }

    // compileSdk 37 resolves to the "android-37.0" platform package; AGP 9
    // needs compileSdkMinor=0 to pick it up.
    ['com.android.application', 'com.android.library'].each { pluginId ->
        p.pluginManager.withPlugin(pluginId) {
            p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                if (dsl.compileSdk == 37) dsl.compileSdkMinor = 0
            }
        }
    }
}
