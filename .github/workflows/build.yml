name: Build TV x86_64

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "media3-stubs/**"
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tv-x86_64
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android SDK 37.0 / NDK / CMake
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1'

      - name: Clone upstream sources
        run: |
          echo "Cloning FongMi/TV@fongmi ..."
          git clone --depth 1 --branch fongmi https://github.com/FongMi/TV.git tv
          echo "Cloning FongMi/media@release-1.11.0-fongmi ..."
          git clone --depth 1 --branch release-1.11.0-fongmi https://github.com/FongMi/media.git media3
          echo "TV commit:     $(git -C tv rev-parse HEAD)"
          echo "Media3 commit: $(git -C media3 rev-parse HEAD)"

      - name: Apply patches
        run: python3 scripts/patch.py "$PWD/tv" "$PWD/media3"

      - name: Write SDK 37.0 compat init script
        run: |
          cat > "$RUNNER_TEMP/sdk-compat.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              ['com.android.application', 'com.android.library'].each { pluginId ->
                  p.pluginManager.withPlugin(pluginId) {
                      p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                          if (dsl.compileSdk == 37) dsl.compileSdkMinor = 0
                      }
                  }
              }
          }
          GRADLE

      - name: Build x86_64 APKs
        working-directory: tv
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/media3
        run: |
          chmod +x ./gradlew
          ./gradlew -I "$RUNNER_TEMP/sdk-compat.gradle" \
            :app:assembleLeanbackDebug :app:assembleMobileDebug \
            --no-daemon --max-workers=2 --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          find tv/app/build/outputs/apk -name '*.apk' -type f -exec cp {} dist/ \;
          ls -lh dist/
          test -n "$(ls -A dist/*.apk 2>/dev/null)" || { echo "No APK produced"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tv-x86_64-apks
          path: dist/*.apk
          retention-days: 30

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: TV x86_64 (${{ github.run_number }})
          generate_release_notes: true
          body: |
            Automated x86_64 build of [FongMi/TV](https://github.com/FongMi/TV)@fongmi.

            - Player: ExoPlayer (custom Media3 built from source, default engine)
            - ABI: x86_64 (native, no ARM translation)
            - Signature: Android debug key (sideload only)
            - Runtime modules (Python/Node/QuickJS/Thunder/mpv native) not bundled
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
